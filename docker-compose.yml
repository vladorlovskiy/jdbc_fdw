services:
  db:
    image: p17:latest
    ports:
      - "5430:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      # PGDATA3: "/var/lib/postgresql/18/docker"
      # CLASSPATH: "/usr/lib/postgresql/18/lib"
    user: root
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/18/docker:rw
      - ./:/usr/share/postgresql/17/contrib/jdbc_fdw_live
      - ./db_drivers:/db_drivers

volumes:
  postgres_data:
    driver: local
